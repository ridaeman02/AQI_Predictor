name: Daily Training Pipeline

on:
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight
  workflow_dispatch:      # Allow manual triggering

jobs:
  run-training-pipeline:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-mlops.txt

    - name: Run training pipeline
      env:
        HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}
      run: |
        mkdir -p models
        # This script automatically trains, evaluates, and pushes to Hopsworks Model Registry
        python src/training/train_model.py

    - name: Verify generated model artifacts
      run: |
        if [ ! -f "models/aqi_random_forest.pkl" ]; then
          echo "Error: Random Forest model artifact not found!"
          exit 1
        fi
        if [ ! -f "models/aqi_ridge.pkl" ]; then
          echo "Error: Ridge Regression model artifact not found!"
          exit 1
        fi
        if [ ! -f "models/aqi_xgboost.pkl" ]; then
          echo "Error: XGBoost model artifact not found!"
          exit 1
        fi
        if [ ! -f "models/aqi_lstm.keras" ]; then
          echo "Error: LSTM model artifact not found!"
          exit 1
        fi
        if [ ! -f "models/aqi_lstm_scaler.pkl" ]; then
          echo "Error: LSTM Scaler artifact not found!"
          exit 1
        fi
        echo "All model artifacts verified successfully."
