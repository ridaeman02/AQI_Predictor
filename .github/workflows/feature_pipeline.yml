name: Hourly Feature Pipeline

on:
  schedule:
    - cron: '0 * * * *'  # Run every hour
  workflow_dispatch:      # Allow manual triggering

jobs:
  run-feature-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-mlops.txt

    - name: Run data collection
      env:
        OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      run: |
        # Collect current data snapshot
        python src/data_pipeline/fetch_data.py

    - name: Run feature engineering
      run: |
        # Ensure the data output directory exists
        mkdir -p data
        # Run feature processing logic
        python src/feature_engineering/features.py
      
    - name: Run predictions and check alerts
      env:
        ALERT_EMAIL_ENABLED: 'true'
        ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        SMTP_HOST: ${{ secrets.SMTP_HOST }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        AQI_ALERT_LEVEL: 'Unhealthy'
        OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      run: |
        python src/alerts/check_alerts.py

    - name: Commit and Push Alert State
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/alert_state.json || true
        git commit -m "Update hourly AQI alert state [skip ci]" || true
        git push

    - name: Upload features to Hopsworks
      env:
        HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}
      run: |
        # Synchronize features with Hopsworks Feature Store
        python src/feature_store/upload_features.py

    - name: Validate output files
      run: |
        if [ ! -f "data/raw_data.csv" ]; then
          echo "Error: raw_data.csv was not generated."
          exit 1
        fi
        if [ ! -f "data/processed_features.csv" ]; then
          echo "Error: processed_features.csv was not generated."
          exit 1
        fi
        echo "All output files generated successfully."
